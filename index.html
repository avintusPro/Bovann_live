<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OCD Live</title>
<style>
:root{--or:#d2601a;--or2:#f08a2c;--ink:#2b190d;--veil:rgba(255,255,255,.28);--glass:rgba(255,255,255,.55);--edge:rgba(210,96,26,.55);--base:#bfc2cf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#fff;--veil:rgba(14,9,5,.6);--glass:rgba(25,16,9,.55);--base:#17120e}}
:root[data-theme="dark"]{--ink:#fff;--veil:rgba(14,9,5,.6);--glass:rgba(25,16,9,.55);--base:#17120e}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--base);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#splash{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#fff;transition:opacity .8s ease,visibility .8s}
@media (prefers-color-scheme:dark){#splash{background:#120d09}}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:min(68vw,380px);animation:pop 1.6s cubic-bezier(.2,.8,.2,1) both}
#splash i{position:absolute;bottom:18%;width:120px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--or),var(--or2));transform-origin:left;animation:bar 2.2s ease-in-out both}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#home{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 22px) 20px calc(env(safe-area-inset-bottom,0px) + 28px);opacity:0;transform:scale(1.04);transition:opacity 1s ease,transform 1.4s ease}
#home.in{opacity:1;transform:none}

.veil{background:linear-gradient(180deg,var(--veil),transparent 35%,transparent 55%,var(--veil))}
header{display:flex;align-items:center;justify-content:space-between}
header b{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--or)}
header span{font-size:12px;padding:6px 12px;border-radius:99px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--edge)}

h1 em{font-style:normal;color:var(--or)}
p{opacity:.8;font-size:15px;margin-bottom:20px;max-width:34ch}
.row{display:grid;gap:12px;max-width:560px}
@media (min-width:700px){.row{grid-template-columns:1fr 1fr}}
button{font:inherit;cursor:pointer;display:flex;align-items:center;gap:14px;text-align:left;padding:16px 18px;border-radius:20px;border:1px solid var(--edge);color:var(--ink);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .2s,box-shadow .2s}
button:active{transform:scale(.97)}
button.main{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;border-color:transparent;box-shadow:0 10px 30px rgba(210,96,26,.45)}
button .ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.22);font-size:22px}
button:not(.main) .ic{background:rgba(210,96,26,.15);color:var(--or)}
button strong{display:block;font-size:18px}
button small{opacity:.8;font-size:13px}
button .go{margin-left:auto;font-size:22px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--or);margin-right:7px;animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.25}}

.flow{position:fixed;inset:0;z-index:15;display:none;flex-direction:column;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .flow{background:rgba(14,9,5,.84)}}
.flow.open{display:flex;animation:fi .5s ease both}
@keyframes fi{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px}
.top .bk{width:42px;height:42px;padding:0;justify-content:center;border-radius:50%;font-size:22px}
.top b{font-size:15px;color:var(--or);display:block}.top small{opacity:.75;font-size:12px}
.pg{height:3px;background:var(--edge);margin:0 16px;border-radius:3px;overflow:hidden}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--or2));transition:width .5s}
#view{flex:1;overflow-y:auto;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 28px);max-width:640px;width:100%;margin:0 auto}
#view h2{font-size:24px;letter-spacing:-.01em;margin-bottom:6px}#view .sub{opacity:.75;font-size:14px;margin-bottom:18px}
.rv{opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0)*90ms)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card{border:1px solid var(--edge);background:var(--glass);border-radius:18px;padding:16px;margin-bottom:12px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.of{width:100%;justify-content:space-between}.of b{font-size:17px;display:block}.of small{opacity:.75}.of em{font-style:normal;font-weight:800;color:var(--or);font-size:17px;white-space:nowrap}
label{display:block;font-size:13px;margin:14px 0 6px;opacity:.85}
.in{width:100%;padding:14px;border-radius:14px;border:1px solid var(--edge);background:var(--glass);color:var(--ink);font:inherit;font-size:16px}
.in:focus{outline:2px solid var(--or)}textarea.in{min-height:96px;resize:vertical}
.err{color:#e5484d;font-size:13px;margin-top:10px;min-height:18px}
.cta{width:100%;justify-content:center;margin-top:14px;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;border-color:transparent;font-weight:700;font-size:16px}
.cta[disabled]{opacity:.45;pointer-events:none}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;text-transform:capitalize;font-weight:700}
.mh button{padding:8px 14px;border-radius:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px}
.cal span{opacity:.6;padding:4px 0}
.cal button{padding:12px 0;justify-content:center;border-radius:12px;font-size:15px;gap:0}
.cal .off{opacity:.28;pointer-events:none}.cal .sel{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;border-color:transparent}
.sl{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-radius:14px;border:1px solid var(--edge);background:var(--glass);margin-bottom:8px;font-size:15px;width:100%;color:var(--ink);font:inherit}
.sl.busy{opacity:.45;text-decoration:line-through;pointer-events:none}.sl.pause{opacity:.55;border-style:dashed;pointer-events:none;justify-content:center}
.sl.sel{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;border-color:transparent}
.sl i{font-style:normal;font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(210,96,26,.18);color:var(--or)}.sl.sel i{background:rgba(255,255,255,.25);color:#fff}
.msg{padding:14px;border-radius:14px;background:rgba(229,72,77,.14);border:1px solid rgba(229,72,77,.5);margin-bottom:14px;font-size:14px}
.ok{width:76px;height:76px;border-radius:50%;margin:8px auto 16px;display:grid;place-items:center;font-size:38px;color:#fff;background:linear-gradient(135deg,var(--or),var(--or2));animation:pop2 .7s cubic-bezier(.2,1.4,.3,1) both}
@keyframes pop2{from{transform:scale(0)}to{transform:scale(1)}}
.rc div{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--edge);font-size:14px}.rc div:last-child{border:0}.rc span:first-child{opacity:.7}.rc span:last-child{text-align:right}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:6px;padding:6px 14px calc(env(safe-area-inset-bottom,0px) + 6px);background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--edge);opacity:0;pointer-events:none;transition:opacity .8s}
body.ready #tabs{opacity:1;pointer-events:auto}
#tabs button{flex:1;flex-direction:column;justify-content:center;gap:2px;padding:7px;border:0;border-radius:14px;background:none;box-shadow:none;font-size:12px;-webkit-backdrop-filter:none;backdrop-filter:none;color:var(--ink);opacity:.7}
#tabs button span{font-size:20px}#tabs button.on{color:var(--or);opacity:1;font-weight:700}
#home{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
#view{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)!important}
.cal button{flex-direction:column}.cal button small{font-size:10px;line-height:1;margin-top:1px}.cal .lock{opacity:.5;pointer-events:none;background:rgba(120,120,120,.18);border-style:dashed}
#auth{position:fixed;inset:0;z-index:18;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 22px calc(env(safe-area-inset-bottom,0px) + 24px);overflow-y:auto;background:linear-gradient(160deg,#fff,#ffe6d2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #auth{background:linear-gradient(160deg,#120d09,#2c1708)}}
#auth.open{display:flex;animation:fi .7s ease both}
#auth .box{width:100%;max-width:420px}#auth img{width:150px;display:block;margin:0 auto 6px}#auth h2{font-size:26px;margin:14px 0 6px;text-align:center}#auth .sub{text-align:center;opacity:.75;font-size:14px;margin:0 0 8px}
#adm{position:fixed;inset:0;z-index:40;display:none;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px calc(env(safe-area-inset-bottom,0px) + 30px);background:linear-gradient(160deg,#fff,#ffe6d2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #adm{background:linear-gradient(160deg,#120d09,#2c1708)}}
#adm.open{display:block}#adm .box{max-width:560px;margin:0 auto}#adm h2{font-size:24px;margin-bottom:4px}#adm h3{font-size:16px;margin:22px 0 10px;color:var(--or)}
.del{padding:6px 12px;border-radius:10px;font-size:13px;color:#e5484d;border-color:rgba(229,72,77,.5)}.lk{display:flex;align-items:center;justify-content:center;text-decoration:none;padding:13px;border-radius:14px;margin-top:10px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--or),var(--or2))}
#atabs{position:fixed;left:0;right:0;bottom:0;z-index:41;display:none;gap:4px;padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 6px);background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--edge)}
#atabs.show{display:flex}#atabs button{flex:1;flex-direction:column;justify-content:center;gap:2px;padding:7px 2px;border:0;border-radius:14px;background:none;box-shadow:none;font-size:11px;color:var(--ink);opacity:.7;-webkit-backdrop-filter:none;backdrop-filter:none}
#atabs button span{font-size:20px}#atabs button.on{color:var(--or);opacity:1;font-weight:700}
#adm{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 100px)!important}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kp{margin:0;text-align:center}.kp b{display:block;font-size:22px;color:var(--or)}.kp small{opacity:.75;font-size:12px}
.bar{height:8px;border-radius:8px;background:var(--edge);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--or2));border-radius:8px}
.kp[data-k]{cursor:pointer;position:relative}.kp[data-k]::after{content:'›';position:absolute;right:10px;top:8px;color:var(--or);font-size:18px}video.pv{width:100%;border-radius:12px;background:#000;max-height:60vh}
.pl{color:#2ea043;font-size:15px;margin-left:5px;font-weight:700}
.fb{cursor:pointer;padding:8px 10px;margin:0 -10px 4px;border-radius:12px}.fb:active{background:var(--glass)}
.sp{width:54px;height:54px;border:5px solid var(--edge);border-top-color:var(--or);border-radius:50%;animation:rot 1s linear infinite;margin:40px auto 20px}@keyframes rot{to{transform:rotate(360deg)}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:18px;border:1px solid var(--edge);background:var(--glass);margin:6px 0 4px}.seg button{justify-content:center;padding:11px 6px;border-radius:14px;border:0;background:none;box-shadow:none;font-size:14px;-webkit-backdrop-filter:none;backdrop-filter:none;color:var(--ink)}.seg button.on{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;font-weight:700}
